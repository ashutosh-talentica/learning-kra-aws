services:
  # 1. Reverse Proxy / Front-door Gateway (ALB concept)
  nginx:
    image: nginx:alpine
    container_name: poc-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - app-network

  # 2. REST API Service (ECS Fargate Task concept)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: poc-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: taskdb
      DATABASE_USER: taskuser
      DATABASE_PASSWORD: taskpassword
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_NAME: task-events
      SQS_QUEUE_URL: http://localstack:4566/000000000000/task-events
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - app-network

  # 3. Asynchronous Worker Service (ECS Background Worker concept)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: poc-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_QUEUE_NAME: task-events
      SQS_QUEUE_URL: http://localstack:4566/000000000000/task-events
      S3_BUCKET_NAME: task-event-artifacts
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - app-network

  # 4. PostgreSQL Relational Database (Amazon RDS concept)
  postgres:
    image: postgres:15-alpine
    container_name: poc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 5. LocalStack AWS Service Emulator (SQS & S3)
  localstack:
    image: localstack/localstack:latest
    container_name: poc-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
